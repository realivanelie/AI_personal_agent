# Pipeline CI/CD — AI Personal Agent
#
# Déclenchement : push ou PR sur main/master
#
# Jobs :
#   1. lint     — qualité du code (flake8), sans dépendances lourdes
#   2. unit     — tests unitaires (pytest, venv Python 3.10)
#   3. build    — build & push de l'image Docker vers ghcr.io
#   4. api-test — tests d'intégration sur le conteneur issu du build
#
# Dépendances :
#   lint  ──┐
#   unit  ──┤──► build ──► api-test
#
# Secrets requis : aucun (GITHUB_TOKEN est fourni automatiquement)
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.10"

jobs:

  # ----------------------------------------------------------
  # Job 1 : Qualité du code (flake8)
  # Rapide, pas de lourdes dépendances — bloque le build tôt
  # ----------------------------------------------------------
  lint:
    name: Qualité du code (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation de flake8
        run: pip install flake8

      - name: Vérification flake8
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git,*.pyc \
            --select=E9,F63,F7,F82
          # E9  : erreurs de syntaxe Python
          # F63 : mauvais usage assertions / étoiles
          # F7  : erreurs syntaxe dans annotations
          # F82 : variables non définies (undefined name)

  # ----------------------------------------------------------
  # Job 2 : Tests unitaires (pytest)
  # Sans Ollama ni ChromaDB — tous les LLM sont mockés
  # ----------------------------------------------------------
  unit:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancement des tests unitaires
        run: |
          python -m pytest tests/unit/ \
            -m "not integration and not ollama" \
            --tb=short \
            --verbose \
            -p no:warnings

  # ----------------------------------------------------------
  # Job 3 : Build & Push de l'image Docker vers ghcr.io
  # Attend que lint ET unit soient verts
  # ----------------------------------------------------------
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # Job 4 : Tests d'intégration sur le conteneur Docker
  # Utilise l'image buildée au job précédent (sha tag)
  # ----------------------------------------------------------
  api-test:
    name: Tests API (Docker)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull de l'image buildée (par digest)
        run: |
          IMAGE_REF="${REGISTRY}/${GITHUB_REPOSITORY,,}@${{ needs.build.outputs.image_digest }}"
          docker pull "$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> $GITHUB_ENV

      - name: Lancement du conteneur API
        run: |
          docker run -d \
            --name ai-agent-api \
            -p 8000:8000 \
            -e COMMIT_ID=${{ github.sha }} \
            ${{ env.IMAGE_REF }}

      - name: Attente que l'API soit prête (health check)
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "API prête après $i tentative(s)."
              exit 0
            fi
            echo "Tentative $i/20 — attente 3s..."
            sleep 3
          done
          echo "L'API n'a pas démarré dans les temps."
          docker logs ai-agent-api
          exit 1

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation de pytest + httpx
        run: pip install pytest httpx

      - name: Exécution des tests d'intégration HTTP
        run: |
          python -m pytest tests/integration/ \
            -m "not ollama" \
            --tb=short \
            --verbose
        env:
          API_BASE_URL: http://localhost:8000
          COMMIT_ID: ${{ github.sha }}

      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs ai-agent-api || true

      - name: Arrêt et suppression du conteneur
        if: always()
        run: docker rm -f ai-agent-api || true
